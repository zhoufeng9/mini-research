[project]
name = "mini-research"
version = "0.1.0"
description = "A small, evidence-grounded web research assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "langchain>=1.0.0,<2",
  "langchain-openai>=1.0.0,<2",
  "langgraph>=1.0.0,<2",
  "pydantic>=2.0.0,<3",
  "python-dotenv>=1.0.0,<2",
  "tavily-python>=0.5.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10",
  "ruff>=0.6.0,<1",
]

[project.scripts]
mini-research = "mini_research.app:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mini_research*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
